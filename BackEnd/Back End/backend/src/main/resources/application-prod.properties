spring.datasource.url=${DB_URL}
# Original Neon requires explicit DB_TARGET_ID=neon-original and its pinned host/database/app role.
# No opt-in preserves the existing Task5 policy; migration targeting remains unchanged.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:verify-full}
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.datasource.hikari.data-source-properties.currentSchema=public
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.flyway.enabled=false
# Reuse the initial physical connection for identity verification and Hibernate.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=1
# Disable keepalive probes; normal pool lifetime/idle maintenance still applies.
spring.datasource.hikari.keepalive-time=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
app.frontend.url=${FRONTEND_URL}
app.dev.seed-user.enabled=false
app.security.rate-limit.exempt-local=false
app.security.client-ip.trusted-header=CF-Connecting-IP

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.debug=false
app.mail.from=${MAIL_FROM}
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
