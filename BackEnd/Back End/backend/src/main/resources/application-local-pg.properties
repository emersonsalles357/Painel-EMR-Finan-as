# Explicit disposable-local profile. Never use for Neon or published services.
spring.datasource.url=${EMR_LOCAL_PG_URL}
spring.datasource.username=emr_task5_app
spring.datasource.password=${EMR_LOCAL_PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.sslmode=disable
spring.datasource.hikari.data-source-properties.currentSchema=public
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
app.dev.seed-user.enabled=false
app.security.rate-limit.exempt-local=false
server.address=127.0.0.1
