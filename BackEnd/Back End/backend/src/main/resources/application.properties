spring.application.name=emr-financas
spring.profiles.default=dev
server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.error.include-message=never
server.error.include-stacktrace=never

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}

# Password Reset Configuration
app.security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}

# Mail Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:noreply@emrfinancas.com.br}

