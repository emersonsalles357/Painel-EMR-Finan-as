spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/emr_financas}
spring.datasource.username=${DEV_DB_USERNAME:postgres}
spring.datasource.password=${DEV_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=${DEV_DB_SSL_MODE:disable}

spring.jpa.show-sql=true

app.dev.seed-user.enabled=${DEV_SEED_USER_ENABLED:false}
