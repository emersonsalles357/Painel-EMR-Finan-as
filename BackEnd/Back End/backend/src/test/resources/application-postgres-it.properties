spring.datasource.url=${EMR_LOCAL_PG_URL:jdbc:postgresql://127.0.0.1:61833/emr_finalization_it}
spring.datasource.username=${EMR_LOCAL_PG_USERNAME:emr_local}
spring.datasource.password=${EMR_LOCAL_PG_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=disable
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
app.dev.seed-user.enabled=false
app.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes-for-postgres-it
app.jwt.expiration-ms=3600000
app.security.rate-limit.exempt-local=true
