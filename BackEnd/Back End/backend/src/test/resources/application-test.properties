spring.datasource.url=jdbc:h2:mem:emr_financas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false
app.dev.seed-user.enabled=false
app.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes
app.jwt.expiration-ms=3600000
